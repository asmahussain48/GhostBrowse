<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GhostBrowse</title>
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header class="head">
    <img id="logo" class="logo" src="../icons/icon32.png" alt="" width="24" height="24">
    <h1>GhostBrowse</h1>
    <span id="stateLabel" class="state-label"></span>
    <label class="switch" data-i18n-title="popupToggle">
      <input type="checkbox" id="enabled" role="switch" data-i18n-aria-label="popupToggle">
      <span class="track"><span class="thumb"></span></span>
    </label>
  </header>

  <div id="ghostBanner" class="ghost-banner" hidden>
    <span aria-hidden="true">👻</span>
    <span id="ghostText"></span>
  </div>

  <section class="status" data-i18n-aria-label="popupStatus">
    <div id="profileRow" class="row" hidden>
      <label for="profile" class="label" data-i18n="popupProfile"></label>
      <select id="profile"></select>
    </div>
    <div class="row">
      <label for="mode" class="label" data-i18n="popupMode"></label>
      <select id="mode"></select>
    </div>
    <div class="row">
      <span class="label" data-i18n="popupRules"></span>
      <span id="rules" class="value"></span>
    </div>
    <div class="row">
      <span class="label" data-i18n="popupLastCleanup"></span>
      <span id="lastCleanup" class="value"></span>
    </div>
    <div class="row">
      <span class="label" data-i18n="popupRemovedToday"></span>
      <span class="value"><strong id="today">0</strong> <span id="total" class="muted"></span></span>
    </div>
  </section>

  <section id="site" class="site" hidden data-i18n-aria-label="popupThisSite">
    <div class="site-head">
      <span class="label" data-i18n="popupThisSite"></span>
      <strong id="siteHost" class="site-host" dir="ltr"></strong>
    </div>
    <p id="siteStatus" class="site-status"></p>
    <div class="site-actions">
      <button id="siteKeep" class="btn small" type="button"></button>
      <button id="siteHide" class="btn small" type="button" hidden></button>
      <button id="siteForget" class="btn small danger" type="button" data-i18n="siteForget"></button>
    </div>
  </section>

  <form id="pinForm" class="pin-prompt" hidden>
    <label for="pinInput" data-i18n="popupPinPrompt"></label>
    <div class="pin-row">
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" maxlength="6" data-i18n-placeholder="pinPlaceholder" dir="ltr">
      <button type="submit" class="btn small primary" data-i18n="pinUnlock"></button>
      <button type="button" id="pinCancel" class="btn small quiet" data-i18n="cancel"></button>
    </div>
    <p id="pinError" class="pin-error" role="alert"></p>
  </form>

  <section class="actions" data-i18n-aria-label="popupActions">
    <button id="cleanNow" class="btn primary wide"><span data-i18n="popupCleanNow"></span><kbd class="kbd" data-command="clean-now" hidden dir="ltr"></kbd></button>
    <div class="range">
      <select id="range" data-i18n-aria-label="popupRange">
        <option value="hour" data-i18n="rangeHour"></option>
        <option value="today" data-i18n="rangeToday"></option>
        <option value="week" data-i18n="rangeWeek"></option>
        <option value="all" data-i18n="rangeAll"></option>
      </select>
      <button id="cleanRange" class="btn" data-i18n="popupCleanRange"></button>
    </div>
    <button id="ghost" class="btn wide ghost-btn"><span id="ghostLabel"></span><kbd class="kbd" data-command="toggle-ghost" hidden dir="ltr"></kbd></button>
    <p id="result" class="result" role="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <a href="#" id="openSettings" data-i18n="popupSettings"></a>
    <a href="#" id="openHelp" data-i18n="popupHelp"></a>
  </footer>
</body>
</html>
